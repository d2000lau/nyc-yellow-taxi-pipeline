nyc_taxi:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'postgres') }}"
      password: "{{ env_var('DB_PASSWORD', 'REDACTED_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('DB_NAME', 'taxi') }}"
      schema: analytics
      threads: 4